services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8000}:8000"
    volumes:
      - db_data:/app/data
    command:
      - sh
      - -c
      - |
        # Остановить запуск при ошибке любой команды.
        set -e
        # Применить миграции и собрать статические файлы.
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        # Запустить приложение одним рабочим процессом.
        exec gunicorn learning_log.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 1 \
          --threads 4 \
          --timeout 60
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db_data:
